[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costco-cli"
version = "0.1.0"
description = "Track your Costco purchases and catch price adjustments from the command line"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marc Kocher" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The LittleHorse task worker is optional: the CLI and its SQLite record work
# without a server. Kept out of the core deps because the SDK caps at Python
# <3.14 while the CLI itself runs anywhere from 3.10 up.
littlehorse = ["littlehorse-client==1.3.1"]

[project.scripts]
costco = "costco_cli.cli:main"
# Long-running task worker for the claim workflow. Needs the `littlehorse`
# extra, so install from an interpreter the SDK supports (3.10-3.13).
costco-worker = "costco_cli.lh:worker_main"

[project.urls]
Homepage = "https://github.com/mdkocher/costco-cli"

[tool.setuptools.packages.find]
where = ["src"]
