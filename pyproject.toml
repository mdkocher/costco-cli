[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costco-cli"
version = "0.1.0"
description = "Track your Costco purchases and catch price adjustments from the command line"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marc Kocher" }]
# Capped at <3.14 by littlehorse-client, which is a core dependency: claim
# tracking is part of the architecture, not a bolt-on.
requires-python = ">=3.10,<3.14"
dependencies = ["requests>=2.31", "playwright>=1.45", "littlehorse-client==1.3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
costco = "costco_cli.cli:main"
# Long-running task worker for the claim workflow: run it alongside the server.
costco-worker = "costco_cli.lh:worker_main"

[project.urls]
Homepage = "https://github.com/mdkocher/costco-cli"

[tool.setuptools.packages.find]
where = ["src"]
